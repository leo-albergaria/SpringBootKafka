spring:
  application:
    name: pedidos
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: icompras-atualizacao-pedido
      auto-offset-reset: earliest
  cloud:
    discovery:
      client:
        simple:
          enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5555/icompraspedidos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

icompras:
  pedidos:
    clients:
      produtos:
        url: http://localhost:8081/produtos
      clientes:
        url: http://localhost:8082/clientes
  config:
    kafka:
      server-url: localhost:29092
      topics:
        pedidos-pagos: icompras.pedidos-pagos
        pedidos-faturados: icompras.pedidos-faturados
        pedidos-enviados: icompras.pedidos-enviados